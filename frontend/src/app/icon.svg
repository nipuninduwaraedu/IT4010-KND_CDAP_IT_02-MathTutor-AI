<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Slate Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4" />

  <!-- GEOMETRIC / AI EMBLEM -->
  <g transform="translate(0, 35)">
    <!-- Semicircle Arc -->
    <circle cx="256" cy="220" r="145" fill="none" stroke="#334155" stroke-width="3.5" stroke-dasharray="6 8" opacity="0.7" />

    <!-- Theorem Angle Arc -->
    <path d="M 222 284 A 42 42 0 0 0 274 278" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Altitude Vector -->
    <line x1="256" y1="100" x2="256" y2="295" stroke="#475569" stroke-width="3" stroke-dasharray="4 6" />

    <!-- Main Delta / Geometric Triangle -->
    <polygon points="256,100 380,295 132,295" fill="none" stroke="url(#primaryGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Center Node -->
    <circle cx="256" cy="220" r="9" fill="url(#accentGrad)" filter="url(#neonGlow)" />

    <!-- Triangle Vertex Nodes -->
    <circle cx="256" cy="100" r="13" fill="#0B0F19" stroke="#38BDF8" stroke-width="5" filter="url(#neonGlow)" />
    <circle cx="256" cy="100" r="5" fill="#FFFFFF" />

    <circle cx="380" cy="295" r="13" fill="#0B0F19" stroke="#818CF8" stroke-width="5" filter="url(#neonGlow)" />
    <circle cx="380" cy="295" r="5" fill="#FFFFFF" />

    <circle cx="132" cy="295" r="13" fill="#0B0F19" stroke="#2563EB" stroke-width="5" filter="url(#neonGlow)" />
    <circle cx="132" cy="295" r="5" fill="#FFFFFF" />
  </g>
</svg>
