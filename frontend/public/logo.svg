<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>

    <!-- Triangle Stroke Vibrant Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Cyan Accent Gradient for nodes/arcs -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter for the AI Nodes & Angle Arc -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Slate Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- GEOMETRIC / AI EMBLEM GROUP -->
  <g transform="translate(0, -25)">
    <!-- Circumscribed Geometry Circle Arc (Semicircle / Cyclic Theme) -->
    <circle cx="256" cy="220" r="145" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.6" />

    <!-- Theorem Angle Arc (Angle Alpha/Theta marker) -->
    <path d="M 222 284 A 42 42 0 0 0 274 278" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Neural Link / Perpendicular Altitude Vector -->
    <line x1="256" y1="100" x2="256" y2="295" stroke="#475569" stroke-width="2" stroke-dasharray="4 6" />

    <!-- Main Delta / Geometric Proof Triangle -->
    <polygon points="256,100 380,295 132,295" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Internal Math Dot / Right-angle Core Node -->
    <circle cx="256" cy="220" r="7" fill="url(#accentGrad)" filter="url(#neonGlow)" />

    <!-- Triangle Vertex Nodes (AI Neural Points) -->
    <!-- Apex Node -->
    <circle cx="256" cy="100" r="11" fill="#0B0F19" stroke="#38BDF8" stroke-width="4.5" filter="url(#neonGlow)" />
    <circle cx="256" cy="100" r="4" fill="#FFFFFF" />

    <!-- Right Node -->
    <circle cx="380" cy="295" r="11" fill="#0B0F19" stroke="#818CF8" stroke-width="4.5" filter="url(#neonGlow)" />
    <circle cx="380" cy="295" r="4" fill="#FFFFFF" />

    <!-- Left Node -->
    <circle cx="132" cy="295" r="11" fill="#0B0F19" stroke="#2563EB" stroke-width="4.5" filter="url(#neonGlow)" />
    <circle cx="132" cy="295" r="4" fill="#FFFFFF" />
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(0, 395)">
    <!-- "MathTutor" Wordmark -->
    <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="-1">
      MathTutor
    </text>

    <!-- AI Badge -->
    <g transform="translate(325, -34)">
      <rect width="64" height="34" rx="8" fill="url(#primaryGrad)" />
      <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
        AI
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="256" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="2.5">
      GEOMETRY DIAGNOSTIC TUTOR
    </text>
  </g>
</svg>
